{% extends 'base.html' %}

{% block page_title %}500 - Server Error{% endblock %}

{% block content %}
<div class="empty-state card" style="max-width: 540px; margin: 3rem auto; padding: 3rem 2rem; text-align: center;">
  <div style="width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--danger-light); color: var(--danger); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem auto;">
    <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
  </div>
  <h2 style="font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.02em;">Server Processing Error</h2>
  <p style="color: var(--text-muted); font-size: 0.9375rem; margin-bottom: 1.75rem; line-height: 1.6;">
    An unexpected error occurred while executing the transaction. Atomic database rollback has safely prevented data corruption.
  </p>
  <div style="display: flex; justify-content: center; gap: 0.75rem;">
    <a href="{% url 'dashboard' %}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
