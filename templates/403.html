{% extends 'base.html' %}

{% block page_title %}403 - Permission Denied{% endblock %}

{% block content %}
<div class="empty-state card" style="max-width: 540px; margin: 3rem auto; padding: 3rem 2rem; text-align: center;">
  <div style="width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--danger-light); color: var(--danger); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem auto;">
    <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
  </div>
  <h2 style="font-family: var(--font-display); font-size: 1.75rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; letter-spacing: -0.02em;">Access Restricted</h2>
  <p style="color: var(--text-muted); font-size: 0.9375rem; margin-bottom: 1.75rem; line-height: 1.6;">
    You do not possess the required workspace role or permissions to view or edit this resource.
  </p>
  <div style="display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
    <a href="{% url 'dashboard' %}" class="btn btn-primary">Return to Dashboard</a>
    <a href="{% url 'team_list' %}" class="btn btn-secondary">View Your Workspaces</a>
  </div>
</div>
{% endblock %}
