{% extends 'base.html' %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card" style="text-align: center;">
    <div style="width: 52px; height: 52px; border-radius: var(--radius-full); background: rgba(167, 196, 160, 0.2); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem auto;">
      <svg width="26" height="26" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <h2 class="auth-title">Check your Email</h2>
    <p class="auth-subtitle" style="margin-top: 0.75rem;">
      If an account exists with the email you entered, we have sent instructions to reset your password.
    </p>
    <div style="margin-top: 1.5rem;">
      <a href="{% url 'login' %}" class="btn btn-secondary">Return to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
