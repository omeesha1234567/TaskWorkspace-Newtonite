services:
  - type: web
    name: newtonite-task-tracker
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    plan: starter
    disk:
      name: media-storage
      mountPath: /var/data/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: newtonite-postgres
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DEFAULT_FROM_EMAIL
        value: "Newtonite Operations <noreply@newtonite.local>"

databases:
  - name: newtonite-postgres
    plan: free
    databaseName: newtonite_db
    user: newtonite_user
